openapi: 3.1.0
info:
  title: TerraProxi API - Paiement Stripe
  version: 1.2.0
  description: |
    Paiement par PaymentIntent : la carte est saisie chez Stripe, le serveur ne la voit jamais (PCI-DSS).
    Contrat d'intégration : specs/contracts/pact-overview.md.
    Implémentation : apps/api/src/routes/stripe.routes.ts.
  contact:
    name: TerraProxi Team
    email: dev@terraproxi.fr
  license:
    name: Proprietary
    url: https://app.terraproxi.fr/legal
servers:
  - url: https://gateway.terraproxi.fr/api
    description: Production
  - url: http://localhost:3002/api
    description: Développement
tags:
  - name: Stripe
    description: Paiements

paths:
  /stripe/payment-intent:
    post:
      summary: Créer le paiement d'une commande
      description: |
        Rôle CONSUMER, propriétaire d'une commande PENDING. Montant = total_price × 100 (centimes, EUR).
        Un intent non annulé déjà associé à la commande est réutilisé.
      operationId: createPaymentIntent
      tags: [Stripe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  format: uuid
              additionalProperties: false
      responses:
        '200':
          description: Secret client à transmettre à Stripe Elements / SDK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          description: Corps invalide, ou commande plus en PENDING
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rôle CONSUMER requis, ou commande d'un autre client
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'
        '404':
          description: Commande introuvable
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'
        '502':
          description: Stripe n'a pas répondu
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'
        '503':
          $ref: '#/components/responses/NotConfigured'

  /stripe/webhook:
    post:
      summary: Webhook Stripe
      description: |
        Appelé par Stripe, sans JWT. La signature (en-tête stripe-signature) est vérifiée sur le corps brut
        avec STRIPE_WEBHOOK_SECRET. Traitement idempotent (Stripe peut renvoyer un événement) :
        - payment_intent.succeeded : la commande passe en PAID si l'intent correspond à celui enregistré
          et qu'elle est PENDING ; le producteur (NEW_ORDER) et le client (PAYMENT) sont notifiés. Si la
          commande a été annulée ou a expiré pendant le paiement, le paiement est remboursé aussitôt ;
        - payment_intent.payment_failed : le client est notifié (PAYMENT) ;
        - les autres événements sont ignorés.
      operationId: handleStripeWebhook
      tags: [Stripe]
      security: []
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Événement Stripe (https://docs.stripe.com/api/events/object)
              required: [type, data]
              properties:
                type:
                  type: string
                  example: payment_intent.succeeded
                data:
                  type: object
      responses:
        '200':
          description: Événement reçu
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    const: true
        '400':
          description: Signature absente ou invalide
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'
        '502':
          description: Remboursement impossible pour l'instant ; Stripe renverra l'événement
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'
        '503':
          $ref: '#/components/responses/NotConfigured'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaymentIntentResponse:
      type: object
      required: [client_secret, payment_intent_id]
      properties:
        client_secret:
          type: string
          example: pi_3Pxxx_secret_xxx
        payment_intent_id:
          type: string
          example: pi_3Pxxx
      additionalProperties: false
  responses:
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    NotConfigured:
      description: Clés Stripe absentes de la configuration du serveur
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
