openapi: 3.1.0
info:
  title: TerraProxi API - Producteurs
  version: 1.1.0
  description: |
    Recherche géolocalisée (PostGIS ST_DWithin) et fiches producteurs.
    Implémentation : apps/api/src/routes/producers.routes.ts — scénarios : specs/features/producers.feature.
  contact:
    name: TerraProxi Team
    email: dev@terraproxi.fr
  license:
    name: Proprietary
    url: https://app.terraproxi.fr/legal
servers:
  - url: https://gateway.terraproxi.fr/api
    description: Production
  - url: http://localhost:3002/api
    description: Développement
tags:
  - name: Producers
    description: Producteurs géolocalisés

paths:
  /producers:
    get:
      summary: Rechercher des producteurs
      description: |
        Avec lat et lon : producteurs situés dans le rayon, triés par distance croissante
        (distance_km renseignée). Sans position : les plus récents d'abord, distance_km à null.
        lat et lon doivent être fournis ensemble.
      operationId: listProducers
      tags: [Producers]
      security: []
      parameters:
        - name: lat
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 43.61
        - name: lon
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 3.88
        - name: radius
          in: query
          description: Rayon en kilomètres (défaut 30)
          schema:
            type: number
            minimum: 0.1
            maximum: 500
            default: 30
        - name: search
          in: query
          description: Recherche insensible à la casse dans le nom et la présentation
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Producteurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/producer.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Créer ou mettre à jour ma fiche
      description: |
        Upsert sur le compte connecté (rôle PRODUCER) : 201 à la création, 200 à la mise à jour.
        Sans latitude/longitude, la position existante est conservée.
      operationId: upsertMyProducer
      tags: [Producers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProducerInput'
      responses:
        '200':
          description: Fiche mise à jour
          content:
            application/json:
              schema:
                $ref: '../schemas/producer.schema.json'
        '201':
          description: Fiche créée
          content:
            application/json:
              schema:
                $ref: '../schemas/producer.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /producers/me:
    get:
      summary: Ma fiche producteur
      description: Fiche du compte connecté ; 404 tant qu'elle n'a pas été créée.
      operationId: getMyProducer
      tags: [Producers]
      responses:
        '200':
          description: Fiche
          content:
            application/json:
              schema:
                $ref: '../schemas/producer.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /producers/{id}:
    get:
      summary: Fiche publique
      description: Fiche d'un producteur avec ses catégories, accessible sans compte.
      operationId: getProducer
      tags: [Producers]
      security: []
      parameters:
        - $ref: '#/components/parameters/ProducerId'
      responses:
        '200':
          description: Fiche
          content:
            application/json:
              schema:
                $ref: '../schemas/producer.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProducerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Nombre de résultats (défaut 20, plafonné à 100)
      schema:
        type: integer
        minimum: 1
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    ProducerInput:
      type: object
      required: [company_name]
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        address:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          pattern: '^[0-9]{5}$'
          example: '34980'
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        website_url:
          type: string
          maxLength: 500
        banner_url:
          type: string
          maxLength: 500
        opening_hours:
          type: string
          maxLength: 500
      additionalProperties: false
  responses:
    BadRequest:
      description: Paramètre ou corps invalide
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Forbidden:
      description: Réservé au rôle PRODUCER
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    NotFound:
      description: Producteur introuvable
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
