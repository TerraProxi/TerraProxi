openapi: 3.1.0
info:
  title: TerraProxi API - Catalogue
  version: 1.1.0
  description: |
    Catalogue public et gestion des produits par leur producteur.
    Implémentation : apps/api/src/routes/products.routes.ts — scénarios : specs/features/products.feature.
  contact:
    name: TerraProxi Team
    email: dev@terraproxi.fr
  license:
    name: Proprietary
    url: https://app.terraproxi.fr/legal
servers:
  - url: https://gateway.terraproxi.fr/api
    description: Production
  - url: http://localhost:3002/api
    description: Développement
tags:
  - name: Products
    description: Catalogue produits

paths:
  /products:
    get:
      summary: Catalogue public
      description: Produits de tous les producteurs, les plus récents d'abord, filtrables.
      operationId: listProducts
      tags: [Products]
      security: []
      parameters:
        - name: producer_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            $ref: '../schemas/product.schema.json#/$defs/ProductCategory'
        - name: available
          in: query
          description: true ou false ; absent = tous les produits
          schema:
            type: boolean
        - name: search
          in: query
          description: Recherche insensible à la casse dans le nom et la description
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          description: Nombre de résultats (défaut 40, plafonné à 100)
          schema:
            type: integer
            minimum: 1
            default: 40
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Produits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/product.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Créer un produit
      description: Le produit est rattaché à la fiche du producteur connecté (404 si elle n'existe pas).
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/product.schema.json#/$defs/ProductInput'
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/mine:
    get:
      summary: Mon catalogue
      description: Produits du producteur connecté, masqués compris, triés par nom.
      operationId: listMyProducts
      tags: [Products]
      responses:
        '200':
          description: Produits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Fiche produit
      description: Accessible sans compte.
      operationId: getProduct
      tags: [Products]
      security: []
      responses:
        '200':
          description: Produit, avec producer_name et producer_city
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Modifier un produit
      description: Réservé au producteur propriétaire. unit, category et is_available absents sont conservés.
      operationId: updateProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/product.schema.json#/$defs/ProductInput'
      responses:
        '200':
          description: Produit modifié
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Supprimer un produit
      description: Réservé au producteur propriétaire. Les lignes de commande existantes gardent le nom du produit.
      operationId: deleteProduct
      tags: [Products]
      responses:
        '204':
          description: Produit supprimé
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Paramètre ou corps invalide
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Forbidden:
      description: Rôle PRODUCER requis, ou produit d'un autre producteur
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    NotFound:
      description: Produit ou fiche producteur introuvable
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
