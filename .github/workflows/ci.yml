name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Specs, typage, tests API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: terraproxi_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d terraproxi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app_user:ci_password@localhost:5432/terraproxi_test
    steps:
      - uses: actions/checkout@v4

      # Version lue dans package.json (packageManager)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Lint des specs OpenAPI
        run: pnpm spec:lint

      - name: Typage (API, web, mobile)
        run: pnpm typecheck

      - name: Tests API (unitaires + intégration PostGIS)
        run: pnpm test

      - name: Build web
        run: pnpm build:web

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image API
        run: docker build -f apps/api/Dockerfile -t terraproxi-back:ci .

      - name: Build de l'image web
        run: docker build -f apps/web/Dockerfile -t terraproxi-front:ci .

      - name: L'API démarre, migre et répond sur /health
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_DB=terraproxi -e POSTGRES_USER=app_user -e POSTGRES_PASSWORD=pw \
            postgis/postgis:16-3.4-alpine
          until docker exec db pg_isready -U app_user -d terraproxi; do sleep 2; done
          docker run -d --name api --network ci -p 3002:3002 \
            -e DATABASE_URL=postgres://app_user:pw@db:5432/terraproxi \
            -e JWT_SECRET=ci-only-secret-0123456789abcdefghij \
            terraproxi-back:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3002/health | grep -q '"database":"up"'; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
