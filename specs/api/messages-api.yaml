openapi: 3.1.0
info:
  title: TerraProxi API - Messagerie
  version: 1.2.0
  description: |
    Messagerie entre utilisateurs (consommateurs et producteurs).
    Implémentation : apps/api/src/routes/messages.routes.ts — scénarios : specs/features/messaging.feature.
  contact:
    name: TerraProxi Team
    email: dev@terraproxi.fr
  license:
    name: Proprietary
    url: https://app.terraproxi.fr/legal
servers:
  - url: https://gateway.terraproxi.fr/api
    description: Production
  - url: http://localhost:3002/api
    description: Développement
tags:
  - name: Messages
    description: Messagerie interne

paths:
  /messages:
    get:
      summary: Boîte de réception
      description: Un élément par interlocuteur (dernier message, non-lus), du plus récent au plus ancien.
      operationId: listConversations
      tags: [Messages]
      parameters:
        - name: limit
          in: query
          description: Nombre de conversations (défaut 50, plafonné à 200)
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/message.schema.json#/$defs/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Envoyer un message
      description: |
        Le contenu est nettoyé des espaces en bord ; vide après nettoyage → 400. On ne peut pas s'écrire
        à soi-même. La messagerie relie un client et un producteur (deux clients ou deux producteurs → 403) ;
        un administrateur peut écrire à tous. Le destinataire reçoit une notification NEW_MESSAGE, une seule
        tant qu'il n'a pas lu la précédente de cet interlocuteur.
      operationId: sendMessage
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiver_id, content]
              properties:
                receiver_id:
                  type: string
                  format: uuid
                content:
                  type: string
                  minLength: 1
                  maxLength: 4000
              additionalProperties: false
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema:
                $ref: '../schemas/message.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Deux clients ou deux producteurs ne peuvent pas s'écrire
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'
        '404':
          description: Destinataire inconnu ou désactivé
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'

  /messages/unread-count:
    get:
      summary: Nombre de messages non lus
      description: Alimente le badge de notification.
      operationId: countUnreadMessages
      tags: [Messages]
      responses:
        '200':
          description: Compteur
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count:
                    type: integer
                    minimum: 0
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'

  /messages/{partnerId}:
    get:
      summary: Fil de discussion
      description: |
        Les `limit` messages les plus récents (avant `before` si fourni), dans l'ordre chronologique.
        Marque comme lus les messages reçus de cet interlocuteur. Sans échange, renvoie une liste vide.
      operationId: getConversation
      tags: [Messages]
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Défaut 50, plafonné à 200
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: before
          in: query
          description: Pagination vers le passé (horodatage ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Messages avec prénom et nom de l'expéditeur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/message.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Paramètre ou corps invalide, message vide ou adressé à soi-même
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
