openapi: 3.1.0
info:
  title: TerraProxi API - Supervision
  version: 1.2.0
  description: |
    Point de santé utilisé par le healthcheck Docker, Caddy et infrastructure/docker/deploy.sh.
    Il interroge PostgreSQL à chaque appel et indique si Stripe et Gemini sont configurés
    (un service optionnel absent ne rend pas l'API « degraded »). Surveillé toutes les 5 minutes
    par infrastructure/docker/healthcheck.sh, qui alerte en cas d'échec. Implémentation : apps/api/src/app.ts.
  contact:
    name: TerraProxi Team
    email: dev@terraproxi.fr
  license:
    name: Proprietary
    url: https://app.terraproxi.fr/legal
servers:
  - url: https://gateway.terraproxi.fr
    description: Production (hors préfixe /api)
  - url: http://localhost:3002
    description: Développement
tags:
  - name: Health
    description: Supervision

paths:
  /health:
    get:
      summary: État de l'API
      description: 200 si PostgreSQL répond, 503 sinon.
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        '200':
          description: API et base disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: PostgreSQL ne répond pas (status degraded, database down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  schemas:
    Health:
      type: object
      required: [status, version, database, db_latency_ms, uptime_s, services, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: 1.1.0
        database:
          type: string
          enum: [up, down]
        db_latency_ms:
          type: [integer, 'null']
          minimum: 0
          description: Temps de réponse de PostgreSQL ; null si la base ne répond pas
        uptime_s:
          type: integer
          minimum: 0
        services:
          type: object
          required: [stripe, ai]
          properties:
            stripe:
              type: string
              enum: [configured, missing]
            ai:
              type: string
              enum: [configured, missing]
          additionalProperties: false
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
