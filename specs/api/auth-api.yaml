openapi: 3.1.0
info:
  title: TerraProxi API - Authentification
  version: 1.2.0
  description: |
    Inscription, connexion et sessions. Le jeton d'accès (JWT, 15 min) est renouvelé avec un
    refresh token opaque (7 jours, usage unique) ; seule son empreinte SHA-256 est stockée.
    Protection contre la force brute : au-delà de 5 échecs de connexion par compte et par IP
    (30 par IP) en 15 minutes, et de 10 inscriptions par IP et par heure, l'API répond 429
    avec l'en-tête Retry-After.
    Implémentation : apps/api/src/routes/auth.routes.ts — scénarios : specs/features/auth.feature.
  contact:
    name: TerraProxi Team
    email: dev@terraproxi.fr
  license:
    name: Proprietary
    url: https://app.terraproxi.fr/legal
servers:
  - url: https://gateway.terraproxi.fr/api
    description: Production
  - url: http://localhost:3002/api
    description: Développement
tags:
  - name: Auth
    description: Authentification et sessions

paths:
  /auth/register:
    post:
      summary: Inscription
      description: Crée un compte CONSUMER (par défaut) ou PRODUCER. Le consentement RGPD est obligatoire ; l'email est enregistré en minuscules.
      operationId: register
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, gdpr_consent]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: alice@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                role:
                  type: string
                  enum: [CONSUMER, PRODUCER]
                  default: CONSUMER
                gdpr_consent:
                  type: boolean
                  description: Doit valoir true, sinon 400
                newsletter_opt_in:
                  type: boolean
                  default: false
                  description: Accepte de recevoir les newsletters des producteurs chez qui il a commandé
              additionalProperties: false
      responses:
        '201':
          description: Compte créé, session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      summary: Connexion
      description: |
        Vérifie l'email et le mot de passe (bcrypt). Un compte désactivé ou un email inconnu est refusé
        comme un mauvais mot de passe, en temps constant. Les échecs répétés sont bloqués (429).
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      summary: Renouveler la session
      description: Échange un refresh token valide contre une nouvelle paire de jetons ; l'ancien refresh token est consommé.
      operationId: refreshSession
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenBody'
      responses:
        '200':
          description: Nouvelle paire de jetons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Déconnexion
      description: Révoque le refresh token côté serveur. Répond 204 même si le jeton était déjà invalide.
      operationId: logout
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenBody'
      responses:
        '204':
          description: Session révoquée
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      summary: Utilisateur courant
      description: Renvoie l'utilisateur correspondant au jeton d'accès.
      operationId: getCurrentUser
      tags: [Auth]
      responses:
        '200':
          description: Utilisateur
          content:
            application/json:
              schema:
                $ref: '../schemas/user.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          description: JWT (claims sub, role), 15 minutes
        refresh_token:
          type: string
          description: Jeton opaque, 7 jours, usage unique
      additionalProperties: false
    Session:
      type: object
      required: [user, access_token, refresh_token]
      properties:
        user:
          $ref: '../schemas/user.schema.json'
        access_token:
          type: string
        refresh_token:
          type: string
      additionalProperties: false
    RefreshTokenBody:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
      additionalProperties: false
  responses:
    BadRequest:
      description: Données invalides
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Unauthorized:
      description: Identifiants, jeton ou session invalides
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    NotFound:
      description: Utilisateur introuvable
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Conflict:
      description: Email déjà utilisé
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    TooManyRequests:
      description: Trop de tentatives ; réessayer après le délai indiqué
      headers:
        Retry-After:
          description: Secondes à attendre
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
