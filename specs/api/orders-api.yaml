openapi: 3.1.0
info:
  title: TerraProxi API - Commandes
  version: 1.1.0
  description: |
    Commandes passées par les consommateurs auprès d'un producteur.

    Cycle de vie (apps/api/src/services/order-status.ts) :
    PENDING → PAID (webhook Stripe uniquement) → PREPARING → READY → COMPLETED.
    Le producteur peut annuler jusqu'à PREPARING, le client seulement en PENDING.
    Toute annulation remet les quantités en stock.

    Implémentation : apps/api/src/routes/orders.routes.ts — scénarios : specs/features/cart-orders.feature.
  contact:
    name: TerraProxi Team
    email: dev@terraproxi.fr
  license:
    name: Proprietary
    url: https://app.terraproxi.fr/legal
servers:
  - url: https://gateway.terraproxi.fr/api
    description: Production
  - url: http://localhost:3002/api
    description: Développement
tags:
  - name: Orders
    description: Commandes

paths:
  /orders:
    post:
      summary: Passer commande
      description: |
        Réservé au rôle CONSUMER. Les prix sont lus en base ; le stock est réservé dans la même
        transaction par un UPDATE conditionnel (pas de survente). Les quantités d'un même produit
        sont cumulées. Un produit indisponible, d'un autre producteur ou en stock insuffisant → 400.
      operationId: createOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/cart.schema.json'
      responses:
        '201':
          description: Commande créée en PENDING, avec ses lignes
          content:
            application/json:
              schema:
                $ref: '../schemas/order.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: Mes commandes
      description: Consommateur → ses commandes ; producteur → les commandes reçues. Les plus récentes d'abord.
      operationId: listOrders
      tags: [Orders]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '../schemas/order.schema.json#/$defs/OrderStatus'
        - name: limit
          in: query
          description: Défaut 20, plafonné à 100
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Commandes avec producer_name, consumer_name et items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/order.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      summary: Détail d'une commande
      description: Réservé au client et au producteur de la commande.
      operationId: getOrder
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Commande avec producer_name et items
          content:
            application/json:
              schema:
                $ref: '../schemas/order.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    patch:
      summary: Changer le statut
      description: PAID n'est pas accepté ici (webhook Stripe). Une transition interdite → 409.
      operationId: updateOrderStatus
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PREPARING, READY, COMPLETED, CANCELLED]
              additionalProperties: false
      responses:
        '200':
          description: Commande mise à jour (sans items)
          content:
            application/json:
              schema:
                $ref: '../schemas/order.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition non autorisée pour ce statut ou ce rôle
          content:
            application/json:
              schema:
                $ref: '../contracts/error-envelope.schema.json'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Paramètre, corps ou règle métier invalide (stock, produit, adresse)
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    Forbidden:
      description: Rôle non autorisé ou commande d'un tiers
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
    NotFound:
      description: Commande introuvable
      content:
        application/json:
          schema:
            $ref: '../contracts/error-envelope.schema.json'
